function replay(){paused=false;document.querySelectorAll('.ad').forEach(el=>el.getAnimations({subtree:true}).forEach(a=>{a.currentTime=0;a.play()}));document.querySelector('#pause').textContent='Pause'}
document.querySelector('#replay').onclick=replay;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelectorAll('.ad').forEach(el=>el.getAnimations({subtree:true}).forEach(a=>paused?a.pause():a.play()));document.querySelector('#pause').textContent=paused?'Play':'Pause'};
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{seek(+b.dataset.time);paused=true;document.querySelector('#pause').textContent='Play'});
document.querySelector('#filter').onchange=e=>document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',e.target.value!=='all'&&c.dataset.version!==e.target.value));
document.fonts.ready.then(()=>{fit();resize();replay();window.ready=true});window.addEventListener('resize',resize);window.replay=replay;
</script></body></html>
