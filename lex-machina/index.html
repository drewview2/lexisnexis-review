(function(){
  document.querySelectorAll('[data-asset]').forEach(img=>img.src=ASSETS[img.dataset.asset]);
  const body=document.body;
  function clearModes(){body.classList.remove('paused','frame-one','frame-two')}
  document.getElementById('replay').onclick=()=>{clearModes();document.querySelectorAll('.ad').forEach(a=>{a.style.display='none';void a.offsetHeight;a.style.display='block';});};
  document.getElementById('pause').onclick=()=>{body.classList.toggle('paused');body.classList.remove('frame-one','frame-two')};
  document.getElementById('f1').onclick=()=>{body.classList.remove('paused','frame-two');body.classList.add('frame-one')};
  document.getElementById('f2').onclick=()=>{body.classList.remove('paused','frame-one');body.classList.add('frame-two')};
  const filterBtns=[...document.querySelectorAll('[data-filter]')];
  function applyFilter(value){
    filterBtns.forEach(b=>b.classList.toggle('active',b.dataset.filter===value));
    document.querySelectorAll('.ad-card').forEach(card=>card.classList.toggle('visible',value==='all'||card.dataset.version===value));
    body.classList.toggle('filtering',value!=='all');
  }
  filterBtns.forEach(b=>b.onclick=()=>applyFilter(b.dataset.filter));
  applyFilter('all');
})();
</script>
