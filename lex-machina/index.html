:root{color-scheme:dark;--bg:#17191d;--panel:#101114;--line:#393d45;--muted:#aeb4be;--white:#f6f7f8;--red:#e8171f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:Lato,Arial,Helvetica,sans-serif}
a{color:inherit}
main{max-width:1540px;margin:0 auto;padding:28px 28px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.brand-title{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}.brand-title h1{font-size:25px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.35px}.brand-title .sub{color:#aeb4be;font-size:13px}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #454a53;background:#23262c;color:#f4f5f6;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:13px}.tab.active{border-color:#ed1c24}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.controls button{font:600 13px Lato,Arial,sans-serif;background:#25282f;border:1px solid #525660;border-radius:5px;padding:9px 13px;color:#f4f4f5;cursor:pointer}.controls button:hover{background:#343840}
.filters{display:flex;gap:8px 14px;flex-wrap:wrap;margin:0 0 12px}.filters button{border:0;background:transparent;color:#b8bdc7;font:600 12px Lato,Arial,sans-serif;cursor:pointer;padding:4px 0}.filters button.active,.filters button:hover{color:#fff}
.sizes{display:flex;gap:9px 16px;flex-wrap:wrap;margin:0 0 24px}.sizes a{color:#b8bdc7;text-decoration:none;font-size:12px}.sizes a:hover{color:#fff}
.size-group{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);scroll-margin-top:16px}.size-group h2{font-size:18px;font-weight:600;margin:0 0 18px}.ads{display:flex;flex-wrap:wrap;align-items:flex-start;gap:26px}.ad-card{margin:0;max-width:100%}.ad-card figcaption{font-size:12px;color:#d0d3d9;margin:0 0 9px}.viewport{overflow:hidden;background:#000;outline:1px solid #3b3e45}.artboard{position:relative;transform-origin:0 0;background:#000;overflow:hidden;cursor:default}.ad{position:absolute;inset:0;background:#000;overflow:hidden}.asset{position:absolute;box-sizing:border-box}.asset-img{object-fit:contain;user-select:none;-webkit-user-drag:none}.copy{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.08;color:#fff;z-index:20;padding:0}.copy .copy-line{display:block;white-space:nowrap;flex:0 0 auto;max-width:100%}.copy .red{color:var(--red)}.copy sup{font-size:.48em;line-height:0;vertical-align:baseline;position:relative;top:-.7em;margin-left:.025em}.triangle{z-index:10}.lex{z-index:22}.ln{z-index:24}.cta{display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid var(--red);border-radius:999px;color:#fff;font-weight:700;line-height:1.05;padding:3px 8px;z-index:25;background:#000;white-space:normal}
.frame1{opacity:0;animation:frame1 8s linear infinite both}.frame2{opacity:0;animation:frame2 8s linear infinite both}.triangle{animation:triIn 8s linear infinite both}.lex{animation:lexIn 8s linear infinite both}.ln{animation:lnIn 8s linear infinite both}.cta{animation:ctaIn 8s linear infinite both}

(function(){
  document.querySelectorAll('[data-asset]').forEach(img=>img.src=ASSETS[img.dataset.asset]);
  const body=document.body;
  function clearModes(){body.classList.remove('paused','frame-one','frame-two')}
  document.getElementById('replay').onclick=()=>{clearModes();document.querySelectorAll('.ad').forEach(a=>{a.style.display='none';void a.offsetHeight;a.style.display='block';});};
  document.getElementById('pause').onclick=()=>{body.classList.toggle('paused');body.classList.remove('frame-one','frame-two')};
  document.getElementById('f1').onclick=()=>{body.classList.remove('paused','frame-two');body.classList.add('frame-one')};
  document.getElementById('f2').onclick=()=>{body.classList.remove('paused','frame-one');body.classList.add('frame-two')};
  const filterBtns=[...document.querySelectorAll('[data-filter]')];
  function applyFilter(value){
    filterBtns.forEach(b=>b.classList.toggle('active',b.dataset.filter===value));
    document.querySelectorAll('.ad-card').forEach(card=>card.classList.toggle('visible',value==='all'||card.dataset.version===value));
    body.classList.toggle('filtering',value!=='all');
  }
  filterBtns.forEach(b=>b.onclick=()=>applyFilter(b.dataset.filter));
  applyFilter('all');
})();
</script>
