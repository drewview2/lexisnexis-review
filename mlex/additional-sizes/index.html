  stage.querySelectorAll('[data-logo-first]').forEach(el=>{const first=+el.dataset.logoFirst,last=+el.dataset.logoLast;if(first!==1||last!==total)envelope(el,first,last);});
  stage.querySelectorAll('[data-enter="4500"]').forEach(el=>motion(el,[[0,{opacity:0}],[cta,{opacity:0,easing:'ease-in-out'}],[cta+(+el.dataset.fade||600),{opacity:1}],[duration,{opacity:1}]]));
  stage.querySelectorAll('[data-draw]').forEach(el=>{const t=+el.closest('[data-scene]').dataset.scene===1?900:4800;motion(el,[[0,{transform:'scaleX(0)'}],[t,{transform:'scaleX(0)',easing:'cubic-bezier(.2,.7,.15,1)'}],[t+1000,{transform:'scaleX(1)'}],[duration,{transform:'scaleX(1)'}]]);});
  stage.querySelectorAll('[data-trace]').forEach(el=>motion(el,[[0,{strokeDashoffset:'100',opacity:0}],[cta,{strokeDashoffset:'100',opacity:0}],[cta+100,{strokeDashoffset:'99',opacity:1,easing:'cubic-bezier(.2,.7,.15,1)'}],[cta+1000,{strokeDashoffset:'0',opacity:1}],[duration,{strokeDashoffset:'0',opacity:1}]]));
 });
 startTogether(created,!paused||root!==gallery);return created;
}
function replay(){startTogether(animations);paused=false;document.querySelector('#pause').textContent='Pause';}
function render(updateURL=true){
 document.querySelectorAll('[data-campaign]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.campaign===campaign));
 const groups=new Map();
 for(const d of BOARDS){if(campaign!=='All'&&d.campaign!==campaign)continue;if(controls.ad.value!=='All'&&d.ad!==Number(controls.ad.value))continue;if(controls.size.value!=='All'&&d.w+'x'+d.h!==controls.size.value)continue;const key=d.campaign+'-'+d.ad+'-'+d.w+'x'+d.h;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(d);}
 for(const a of animations)a.cancel();
 const sizeGroups=new Map();
 for(const ds of groups.values()){const d=ds[0],key=d.w+'x'+d.h;if(!sizeGroups.has(key))sizeGroups.set(key,[]);sizeGroups.get(key).push(ds);}
 gallery.innerHTML=[...sizeGroups.values()].map(ads=>{const first=ads[0][0];return '<section class="group"><div class="group-head"><h2>'+first.w+' × '+first.h+'</h2></div><div class="previews">'+ads.map(ds=>{const d=ds[0];return '<figure class="preview" style="--preview-width:'+Math.min(d.w,600)+'px"><figcaption>MLex '+d.campaign+' · Ad '+String(d.ad).padStart(2,'0')+'</figcaption><button class="artwork" data-board="'+d.name+'" aria-label="Open MLex '+d.campaign+' Ad '+d.ad+' '+d.w+' by '+d.h+' animation at actual size">'+animated(ds)+'</button></figure>';}).join('')+'</div></section>';}).join('');
 animations=animate(gallery);
 if(updateURL){const q=new URLSearchParams({campaign,ad:controls.ad.value,size:controls.size.value});history.replaceState(null,'','?'+q);}
}
function fromURL(){const q=new URLSearchParams(location.search);campaign=['AI','IP','All'].includes(q.get('campaign'))?q.get('campaign'):'All';controls.ad.value=['1','2','3','4','5','All'].includes(q.get('ad'))?q.get('ad'):'All';controls.size.value=sizes.concat('All').includes(q.get('size'))?q.get('size'):'All';render(false);}
controls.ad.addEventListener('change',()=>render());controls.size.addEventListener('change',()=>render());
document.querySelectorAll('[data-campaign]').forEach(b=>b.addEventListener('click',()=>{campaign=b.dataset.campaign;render();}));
let modalAnimations=[];
gallery.addEventListener('click',e=>{const btn=e.target.closest('[data-board]');if(!btn)return;const d=BOARDS.find(d=>d.name===btn.dataset.board),ds=BOARDS.filter(b=>b.campaign===d.campaign&&b.ad===d.ad&&b.w===d.w&&b.h===d.h);document.querySelector('#dialog-title').textContent='MLex '+d.campaign+' · Ad '+String(d.ad).padStart(2,'0')+' · '+d.w+' × '+d.h+' · 100%';document.querySelector('.full-frame').innerHTML=animated(ds,'-full');dialog.showModal();modalAnimations=animate(document.querySelector('.full-frame'));});
dialog.addEventListener('close',()=>{modalAnimations.forEach(a=>a.cancel());modalAnimations=[];document.querySelector('.full-frame').innerHTML='';});
document.querySelector('#pause').addEventListener('click',()=>{paused=!paused;for(const a of animations)paused?a.pause():a.play();document.querySelector('#pause').textContent=paused?'Resume':'Pause';});
document.querySelector('#replay').addEventListener('click',replay);
document.querySelector('dialog .close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});window.addEventListener('popstate',fromURL);document.fonts.ready.then(fromURL);
</script></body></html>
