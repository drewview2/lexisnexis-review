*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f3f2;color:#16191d;font-family:Arial,Helvetica,sans-serif}
main{max-width:440px;margin:0 auto;padding:44px 36px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:36px}
h1{font-size:22px;letter-spacing:-.65px;font-weight:600;margin:0}
.controls{display:flex;gap:8px}
.control{background:#fff;border:1px solid #d4d6d8;border-radius:5px;color:#222;padding:9px 12px;font:12px Arial,sans-serif;cursor:pointer}
.control:hover{background:#e8e9eb}
.control:focus-visible{outline:2px solid #e8171f;outline-offset:3px}
.versions{display:grid;grid-template-columns:300px;justify-content:center;gap:44px 32px}
figure{margin:0;width:300px}
figcaption{font-size:13px;line-height:1.5;letter-spacing:.05px;margin:0 0 11px;font-weight:600}
.spec{font-size:11px;letter-spacing:.03em;color:#71757c;font-weight:400;margin-top:2px}
.ad{width:300px;height:250px;background:#060709;color:#fff;position:relative;overflow:hidden;font-family:Lato,Arial,sans-serif;isolation:isolate;box-shadow:0 0 0 1px #16181c}
.ad:before{content:&quot;&quot;;position:absolute;inset:0;background:radial-gradient(ellipse at 50% 5%,#14171d 0%,#0a0c10 46%,#030405 100%);z-index:-1}
.ad p{padding:0;margin:0;color:#fff}.ad span,.ad sup{color:#fff}
.opening,.headline,.support,.underline,.footer{position:absolute}
.opening,.headline,.support{left:20px;width:260px}
.opening{top:24px;height:68px;font-size:27px;line-height:34px;font-weight:400;letter-spacing:-.35px}
.intro,.phrase{display:block;font-size:inherit;line-height:inherit}
.phrase{font-weight:700}
.line{display:block}
.underline{left:20px;top:107px;height:3px;width:142px;background:linear-gradient(135deg,rgba(232,23,31,.14),rgba(251,199,200,.14) 40%,rgba(181,8,19,.14) 73%,rgba(60,2,8,.14));overflow:hidden;border-radius:1.5px}
.line-fill,.line-tip{position:absolute;left:0;top:0;height:3px;transform-origin:left center}
.line-fill{width:0;background:linear-gradient(135deg,#e8171f,#fbc7c8 40%,#b50813 73%,#3c0208);background-size:142px 3px;background-repeat:no-repeat}
.line-tip{width:8px;background:linear-gradient(90deg,rgba(232,23,31,0),#ffbabd)}
.headline{top:24px;font-size:31px;line-height:33px;font-weight:700;letter-spacing:-.7px}
.first-line{width:227.5px}.first-line .line-fill{background-size:227.5px 3px}.second-line{top:103px;width:142px}
.support{top:118px;font-size:18px;line-height:23px;font-weight:400;letter-spacing:-.12px;color:#ffffff}
sup{font-size:.53em;line-height:0;vertical-align:super;position:relative;top:-.05em;margin-left:.03em}
.footer{left:20px;right:20px;top:192px;height:34px;display:flex;align-items:center;justify-content:space-between}
.logo{display:block;width:83px;height:auto}
.cta{position:relative;opacity:0;width:142px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:#000;color:#fff;font-size:14px;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:.05px;padding:0}
.cta-border{position:absolute;inset:0;width:142px;height:34px;pointer-events:none}
.cta-outline{stroke-dasharray:100;stroke-dashoffset:100;opacity:1}
.cta-tip{stroke-dasharray:3 97;stroke-dashoffset:103;opacity:0}
.cta-label{position:relative;opacity:0}
[data-motion]{opacity:0}
.ad.is-ready [data-motion]{opacity:1}
.ad.is-loading .intro,.ad.is-loading .phrase,.ad.is-loading .headline,.ad.is-loading .support,.ad.is-loading .underline{left:20px;top:107px;height:3px;width:142px;background:linear-gradient(135deg,rgba(232,23,31,.14),rgba(251,199,200,.14) 40%,rgba(181,8,19,.14) 73%,rgba(60,2,8,.14));overflow:hidden;border-radius:1.5px}
.line-fill,.line-tip{position:absolute;left:0;top:0;height:3px;transform-origin:left center}
.line-fill{width:0;background:linear-gradient(135deg,#e8171f,#fbc7c8 40%,#b50813 73%,#3c0208);background-size:142px 3px;background-repeat:no-repeat}
.line-tip{width:8px;background:linear-gradient(90deg,rgba(232,23,31,0),#ffbabd)}
@media(max-width:720px){main{padding:26px 10px 48px;max-width:380px}header{margin-bottom:28px;align-items:flex-start;flex-wrap:wrap;gap:16px}.versions{grid-template-columns:300px;gap:32px}.controls{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.control{transition:none}}
@media(pointer:coarse){.control{min-height:44px}}

      &lt;/div&gt;&lt;div hidden&gt;&lt;button id=&quot;pause&quot; type=&quot;button&quot;&gt;Pause&lt;/button&gt;&lt;button id=&quot;replay&quot; type=&quot;button&quot;&gt;Replay&lt;/button&gt;&lt;/div&gt;&lt;script&gt;
(()=&gt;{
  const duration=6000, animations=[];
  let completed=false, paused=false;
  const pauseButton=document.querySelector(&#x27;#pause&#x27;);
  const ad=document.querySelector(&#x27;#ad-a&#x27;);
  const q=name=&gt;ad.querySelector(&#x27;[data-motion=&quot;&#x27;+name+&#x27;&quot;]&#x27;);
  function add(element,frames){
    const a=element.animate(frames.map(({at,...frame})=&gt;({...frame,offset:at/duration})),{duration,fill:&#x27;both&#x27;,easing:&#x27;linear&#x27;});
    a.pause();animations.push(a);return a;
  }
  function reveal(element,start,end,exits=false){
    const hidden={opacity:0,transform:&#x27;translate3d(0,3px,0)&#x27;};
    const shown={opacity:1,transform:&#x27;translate3d(0,0,0)&#x27;};
    const gone={opacity:0,transform:&#x27;translate3d(0,-3px,0)&#x27;};
    const frames=[{at:0,...hidden}];
    if(start&gt;0)frames.push({at:start,...hidden,easing:&#x27;cubic-bezier(.2,.7,.15,1)&#x27;});
    else frames[0].easing=&#x27;cubic-bezier(.2,.7,.15,1)&#x27;;
    frames.push({at:end,...shown});
    if(exits)frames.push({at:2700,...shown,easing:&#x27;ease-in-out&#x27;},{at:2950,...gone},{at:duration,...gone});
    else frames.push({at:duration,...shown});
    return add(element,frames);
  }
  function loadLine(element,start,end,width,exits=false){
    const frames=[{at:0,opacity:0},{at:start,opacity:0},{at:start+80,opacity:1}];
    if(exits)frames.push({at:2700,opacity:1,easing:&#x27;ease-in-out&#x27;},{at:2950,opacity:0},{at:duration,opacity:0});
    else frames.push({at:duration,opacity:1});
    add(element,frames);
    add(element.querySelector(&#x27;.line-fill&#x27;),[
      {at:0,width:&#x27;0px&#x27;},
      {at:start,width:&#x27;0px&#x27;,easing:&#x27;cubic-bezier(.2,.7,.15,1)&#x27;},
      {at:end,width:width+&#x27;px&#x27;},{at:duration,width:width+&#x27;px&#x27;}
    ]);
    const tip=element.querySelector(&#x27;.line-tip&#x27;);
    add(tip,[
      {at:0,transform:&#x27;translateX(-8px)&#x27;},
      {at:start,transform:&#x27;translateX(-8px)&#x27;,easing:&#x27;cubic-bezier(.2,.7,.15,1)&#x27;},
      {at:end,transform:&#x27;translateX(&#x27;+(width-8)+&#x27;px)&#x27;},
      {at:duration,transform:&#x27;translateX(&#x27;+(width-8)+&#x27;px)&#x27;}
    ]);
    add(tip,[{at:0,opacity:0},{at:start,opacity:0},{at:start+80,opacity:1},{at:end-80,opacity:1},{at:end+100,opacity:0},{at:duration,opacity:0}]);
  }
  reveal(q(&#x27;intro&#x27;),0,240,true);
  reveal(q(&#x27;phrase&#x27;),900,1300,true);
  loadLine(q(&#x27;line1&#x27;),900,1900,227.5,true);
  reveal(q(&#x27;headline&#x27;),2950,3350);
  loadLine(q(&#x27;line2&#x27;),2950,3950,142);
  reveal(q(&#x27;support&#x27;),3950,4300);
  const outline=ad.querySelector(&#x27;.cta-outline&#x27;),buttonTip=ad.querySelector(&#x27;.cta-tip&#x27;);
  add(ad.querySelector(&#x27;.cta&#x27;),[{at:0,opacity:0},{at:4500,opacity:0},{at:4580,opacity:1},{at:duration,opacity:1}]);
  add(ad.querySelector(&#x27;.cta-label&#x27;),[{at:0,opacity:0},{at:4500,opacity:0,easing:&#x27;cubic-bezier(.2,.7,.15,1)&#x27;},{at:5500,opacity:1},{at:duration,opacity:1}]);
  function trace(element,from,to){
    add(element,[{at:0,strokeDashoffset:String(from)},{at:4500,strokeDashoffset:String(from),easing:&#x27;cubic-bezier(.2,.7,.15,1)&#x27;},{at:5500,strokeDashoffset:String(to)},{at:duration,strokeDashoffset:String(to)}]);
  }
  trace(outline,100,0);
  trace(buttonTip,103,3);
  add(buttonTip,[{at:0,opacity:0},{at:4500,opacity:0},{at:4580,opacity:1},{at:5420,opacity:1},{at:5600,opacity:0},{at:duration,opacity:0}]);
  function updateLabel(){pauseButton.textContent=completed?&#x27;Play again&#x27;:paused?&#x27;Resume&#x27;:&#x27;Pause&#x27;;}
  function play(){completed=false;paused=false;for(const a of animations){a.currentTime=0;a.play();}updateLabel();}
  function seek(ms){paused=true;completed=ms&gt;=duration;for(const a of animations){a.pause();a.currentTime=Math.min(duration,Math.max(0,ms));}updateLabel();}
  animations[0].onfinish=()=&gt;{completed=true;paused=false;updateLabel();};
  document.querySelector(&#x27;#replay&#x27;).onclick=play;
  pauseButton.onclick=()=&gt;{if(completed){play();return;}paused=!paused;for(const a of animations)paused?a.pause():a.play();updateLabel();};
  window.mlexReview={duration,seek,play,animations};
  Promise.all([document.fonts.ready,...[...document.images].map(i=&gt;i.decode().catch(()=&gt;{}))]).then(()=&gt;{
    ad.classList.remove(&#x27;is-loading&#x27;);ad.classList.add(&#x27;is-ready&#x27;);
    if(matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches)seek(duration);else play();
    document.documentElement.dataset.ready=&#x27;true&#x27;;
  });
})();

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f3f2;color:#16191d;font-family:Arial,Helvetica,sans-serif}
main{max-width:440px;margin:0 auto;padding:44px 36px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:36px}
h1{font-size:22px;letter-spacing:-.65px;font-weight:600;margin:0}
.controls{display:flex;gap:8px}
.control{background:#fff;border:1px solid #d4d6d8;border-radius:5px;color:#222;padding:9px 12px;font:12px Arial,sans-serif;cursor:pointer}
.control:hover{background:#e8e9eb}
.control:focus-visible{outline:2px solid #e8171f;outline-offset:3px}
.versions{display:grid;grid-template-columns:300px;justify-content:center;gap:44px 32px}
figure{margin:0;width:300px}
figcaption{font-size:13px;line-height:1.5;letter-spacing:.05px;margin:0 0 11px;font-weight:600}
.spec{font-size:11px;letter-spacing:.03em;color:#71757c;font-weight:400;margin-top:2px}
.ad{width:300px;height:250px;background:#060709;color:#fff;position:relative;overflow:hidden;font-family:Lato,Arial,sans-serif;isolation:isolate;box-shadow:0 0 0 1px #16181c}
.ad:before{content:&quot;&quot;;position:absolute;inset:0;background:radial-gradient(ellipse at 50% 5%,#14171d 0%,#0a0c10 46%,#030405 100%);z-index:-1}
.ad p{padding:0;margin:0;color:#fff}.ad span,.ad sup{color:#fff}
.opening,.headline,.support,.underline,.footer{position:absolute}
.opening,.headline,.support{left:20px;width:260px}
.opening{top:24px;height:68px;font-size:27px;line-height:34px;font-weight:400;letter-spacing:-.35px}
.intro,.phrase{display:block;font-size:inherit;line-height:inherit}
.phrase{font-weight:700}
.line{display:block}
.underline{left:20px;top:107px;height:3px;width:142px;background:linear-gradient(135deg,rgba(232,23,31,.14),rgba(251,199,200,.14) 40%,rgba(181,8,19,.14) 73%,rgba(60,2,8,.14));overflow:hidden;border-radius:1.5px}
.line-fill,.line-tip{position:absolute;left:0;top:0;height:3px;transform-origin:left center}
.line-fill{width:0;background:linear-gradient(135deg,#e8171f,#fbc7c8 40%,#b50813 73%,#3c0208);background-size:142px 3px;background-repeat:no-repeat}
.line-tip{width:8px;background:linear-gradient(90deg,rgba(232,23,31,0),#ffbabd)}
.headline{top:24px;font-size:31px;line-height:33px;font-weight:700;letter-spacing:-.7px}
.first-line{width:227.5px}.first-line .line-fill{background-size:227.5px 3px}.second-line{top:103px;width:142px}
.support{top:118px;font-size:18px;line-height:23px;font-weight:400;letter-spacing:-.12px;color:#ffffff}
sup{font-size:.53em;line-height:0;vertical-align:super;position:relative;top:-.05em;margin-left:.03em}
.footer{left:20px;right:20px;top:192px;height:34px;display:flex;align-items:center;justify-content:space-between}
.logo{display:block;width:83px;height:auto}
.cta{position:relative;opacity:0;width:142px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:#000;color:#fff;font-size:14px;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:.05px;padding:0}
.cta-border{position:absolute;inset:0;width:142px;height:34px;pointer-events:none}
.cta-outline{stroke-dasharray:100;stroke-dashoffset:100;opacity:1}
.cta-tip{stroke-dasharray:3 97;stroke-dashoffset:103;opacity:0}
.cta-label{position:relative;opacity:0}
[data-motion]{opacity:0}
.ad.is-ready [data-motion]{opacity:1}
.line-fill,.line-tip{position:absolute;left:0;top:0;height:3px;transform-origin:left center}
.line-fill{width:0;background:linear-gradient(135deg,#e8171f,#fbc7c8 40%,#b50813 73%,#3c0208);background-size:142px 3px;background-repeat:no-repeat}
.line-tip{width:8px;background:linear-gradient(90deg,rgba(232,23,31,0),#ffbabd)}
@media(max-width:720px){main{padding:26px 10px 48px;max-width:380px}header{margin-bottom:28px;align-items:flex-start;flex-wrap:wrap;gap:16px}.versions{grid-template-columns:300px;gap:32px}.controls{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.control{transition:none}}
@media(pointer:coarse){.control{min-height:44px}}
.focus-rule{position:absolute;overflow:visible;opacity:0}
.focus-fill{stroke-dasharray:100;stroke-dashoffset:100}
.focus-tip{stroke-dasharray:3 97;stroke-dashoffset:103;opacity:0}

    add(element,[{at:0,strokeDashoffset:String(from)},{at:4500,strokeDashoffset:String(from),easing:&#x27;cubic-bezier(.2,.7,.15,1)&#x27;},{at:5500,strokeDashoffset:String(to)},{at:duration,strokeDashoffset:String(to)}]);
  }
  trace(outline,100,0);
  trace(buttonTip,103,3);
  add(buttonTip,[{at:0,opacity:0},{at:4500,opacity:0},{at:4580,opacity:1},{at:5420,opacity:1},{at:5600,opacity:0},{at:duration,opacity:0}]);
  function updateLabel(){pauseButton.textContent=completed?&#x27;Play again&#x27;:paused?&#x27;Resume&#x27;:&#x27;Pause&#x27;;}
  function play(){completed=false;paused=false;for(const a of animations){a.currentTime=0;a.play();}updateLabel();}
  function seek(ms){paused=true;completed=ms&gt;=duration;for(const a of animations){a.pause();a.currentTime=Math.min(duration,Math.max(0,ms));}updateLabel();}
  animations[0].onfinish=()=&gt;{completed=true;paused=false;updateLabel();};
  document.querySelector(&#x27;#replay&#x27;).onclick=play;
  pauseButton.onclick=()=&gt;{if(completed){play();return;}paused=!paused;for(const a of animations)paused?a.pause():a.play();updateLabel();};
  window.mlexReview={duration,seek,play,animations};
  Promise.all([document.fonts.ready,...[...document.images].map(i=&gt;i.decode().catch(()=&gt;{}))]).then(()=&gt;{
    ad.classList.remove(&#x27;is-loading&#x27;);ad.classList.add(&#x27;is-ready&#x27;);
    if(matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches)seek(duration);else play();
    document.documentElement.dataset.ready=&#x27;true&#x27;;
  });
})();

&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe><button type="button" class="replay">Replay</button></section></div></main><script>function replay(frame){const review=frame.contentWindow.mlexReview;if(review)review.play();}document.querySelectorAll('section').forEach(section=>section.querySelector('button').onclick=()=>replay(section.querySelector('iframe')));document.querySelector('#replay-all').onclick=()=>document.querySelectorAll('iframe').forEach(replay);</script></body></html>
