 q('.news').setAttribute('transform',`translate(${Math.sin(t*Math.PI/6)*12} ${Math.cos(t*Math.PI/6)*8})`);
 if(concept==='reveal'){art.style.transform=`scale(${1+.14*b})`;q('.news').style.opacity=1-.12*b;}else{art.style.transform=`rotate(${-5+10*Math.sin(t*Math.PI/6)})`;q('.panel-art').querySelectorAll('.paper').forEach((p,i)=>p.setAttribute('transform',`translate(${(i-1)*(18+24*b)} ${Math.sin(t*Math.PI/6+i*.7)*10}) rotate(${(i-1)*(5+8*b)} 160 160)`));q('.outer').style.opacity='.38';}
 }};
}
function resize(){for(const view of views){const available=Math.min(window.innerWidth-68,view.w>=970?1000:window.innerWidth-68),s=Math.min(1,available/view.w,view.w===1200?.39:1);view.ad.style.transform=`scale(${s})`;view.viewport.style.width=view.w*s+'px';view.viewport.style.height=view.h*s+'px';view.viewport.parentElement.style.width=(view.w*s+(window.innerWidth<=680?30:34))+'px';}}
function render(){const size=$('#size').value,v=$('#version').value;views=[];$('#grid').innerHTML='';let id=0;for(let i=0;i<COPY.length;i++){if(v!=='all'&&+v!==i)continue;for(const [w,h]of SIZES){if(size!=='all'&&size!==w+'x'+h)continue;const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="cardtitle"><b>${String(i+1).padStart(2,'0')} · ${COPY[i].name}</b><span>${w} × ${h}</span></div><div class="viewport"></div>`;const view=createAd(i,w,h,id++);view.viewport=card.querySelector('.viewport');view.viewport.append(view.ad);$('#grid').append(card);views.push(view);}}
 resize();document.fonts.ready.then(()=>{views.forEach(v=>v.fit());draw(current)});draw(current);
 const params=new URLSearchParams({concept,size,ad:v});history.replaceState(null,'','?'+params.toString());}
function draw(t){current=t;views.forEach(v=>v.draw(t));$('#scrub').value=t;$('#clock').textContent=t.toFixed(1)+' s'}
window.seek=t=>{paused=true;held=Math.max(0,Math.min(11.99,t));$('#pause').textContent='Play';draw(held)};
window.play=()=>{paused=false;start=performance.now()-held*1000;$('#pause').textContent='Pause'};
window.replay=()=>{held=0;start=performance.now();paused=false;$('#pause').textContent='Pause';draw(0)};
$('#pause').onclick=()=>{if(paused)window.play();else window.seek(current)};$('#replay').onclick=window.replay;$('#scrub').oninput=e=>window.seek(+e.target.value);$('#size').onchange=render;$('#version').onchange=render;
function setConcept(c){concept=c;document.querySelectorAll('[data-concept]').forEach(b=>b.classList.toggle('active',b.dataset.concept===c));$('#description').innerHTML=c==='reveal'?'<strong>360° reveal.</strong> A moving circular window brings editorial panels into focus, then opens onto the offer.':'<strong>Editorial panels.</strong> Layered reporting panels slide and fan out around the circular brand motif.';render()}
window.setConcept=setConcept;document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>setConcept(b.dataset.concept));window.addEventListener('resize',resize);
const params=new URLSearchParams(location.search);if([...$('#size').options].some(o=>o.value===params.get('size')))$('#size').value=params.get('size');if([...$('#version').options].some(o=>o.value===params.get('ad')))$('#version').value=params.get('ad');setConcept(params.get('concept')==='panels'?'panels':'reveal');if(matchMedia('(prefers-reduced-motion:reduce)').matches)window.seek(7.5);
function tick(now){if(!paused)draw(((now-start)/1000)%12);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
